name: Analytics stability candidate
on:
  push:
    branches: [fix/analytics-stability-20261026]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node --test tests/analytics-scheduler.test.mjs
      - run: npm run build
      - run: BROWSER=${{ matrix.browser }} TEST_IDS=AS01-recover-429,AS02-independent-kpi,AS03-cancel-reentry,AS04-recover-503,AS05-preserve-partial-refresh,AS06-independent-aging-benner,AS07-hidden-overview-abort PHASE=analytics-ci-${{ matrix.browser }} node tests/runtime-v2/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-browser-${{ matrix.browser }}
          path: docs/runtime-v2/evidence/analytics-ci-${{ matrix.browser }}
