name: Frontend dependency security

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/frontend-dependency-audit.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/frontend-dependency-audit.yml
  schedule:
    - cron: '30 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fail on high/critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
