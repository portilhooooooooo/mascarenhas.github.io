name: Runtime V2 browser fixtures
on:
  push:
    branches: [dev/tasks-workspace, release/runtime-v2-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: BROWSER=${{ matrix.browser }} PHASE=ci-${{ matrix.browser }} node tests/runtime-v2/browser.mjs
      - run: node tests/processos-ui.mjs
        if: matrix.browser == 'chromium'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-v2-fixture-evidence-${{ matrix.browser }}
          path: |
            docs/runtime-v2/evidence/ci-${{ matrix.browser }}
            docs/ux-processos-evidence
