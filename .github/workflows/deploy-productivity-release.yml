name: Publish Productivity React UI
on:
  push:
    branches:
      - test/produtividade-cards-20261021
    paths:
      - .github/workflows/deploy-productivity-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-backoffice-productivity-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate productivity UI and existing routing
        run: |
          npm run test:hardening
          node tests/task-production-view.test.mjs
      - name: Build current branch
        run: npm run build
      - name: Require authorized deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - name: Deploy Cloudflare backoffice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.77.0 deploy
