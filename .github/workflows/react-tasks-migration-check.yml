name: React Tasks Migration Check

on:
  push:
    branches:
      - dev/tasks-workspace
      - design/mascarenhas-identidade-20261009
      - feat/client-navbar-isolation-20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Automation runtime syntax
        run: node --check app.js

      - name: Hardening checks
        run: npm run test:hardening

      - name: Master task execution scope
        run: node --test tests/master-task-scope.test.mjs

      - name: Metabase architecture checks
        run: |
          npm run test:metabase
          python3 -m py_compile scripts/metabase/*.py

      - name: Identidade e prioridades
        run: node --test tests/brand-priorities.test.mjs && node --test tests/brand-themes.test.mjs && node --test tests/theme-contrast-regression.test.mjs

      - name: Production build
        run: npm run build
