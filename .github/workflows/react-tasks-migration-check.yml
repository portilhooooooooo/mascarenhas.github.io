name: React Tasks Migration Check

on:
  push:
    branches:
      - dev/tasks-workspace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hardening checks
        run: npm run test:hardening

      - name: Metabase architecture checks
        run: |
          npm run test:metabase
          python3 -m py_compile scripts/metabase/*.py

      - name: Production build
        run: npm run build
