name: Upload dev stability preview
on:
  push:
    branches: [dev/tasks-workspace]
    paths:
      - .github/workflows/upload-preview-stability.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Frontend regression tests
        run: npm run test:hardening
      - name: Build React frontend
        run: npm run build
      - name: Upload to isolated preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare preview skipped: repo secrets are not configured."
            exit 0
          fi
          npx --yes wrangler@4.77.0 versions upload \
            --preview-alias dev-tasks-workspace \
            --tag frontend-stability-20261012 \
            --message "Ghost modules, task shortcuts, assignments and closing indication filter"
