name: Deploy Access Roles Frontend
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-access-roles.yml
      - src/dashboard/UsersPage.tsx
      - src/tasks/TaskResults.tsx
      - src/tasks/TasksApp.tsx
      - src/tasks/model.ts
      - app.js
      - auth.js
      - index.html
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-access-roles-frontend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:hardening
      - run: npm run build
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.77.0 deploy
