<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backoffice | Mascarenhas Barbosa</title>
<link rel="icon" href="../favicon-copper.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#202224;--muted:#66696b;--line:#dededb;--paper:#fff;--institution:#f4f3f0;--brand:#b97a58}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
.layout{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:58% 42%}
.institution{display:grid;align-content:center;min-width:0;padding:56px clamp(36px,4.5vw,80px);background:var(--institution);border-right:1px solid #e8e6e2}
.institution-inner{width:100%;max-width:910px;margin-inline:auto}
.brand{display:flex;align-items:center;gap:15px;margin:0 0 30px;min-height:46px}
.brand img{width:52px;height:46px;object-fit:contain;display:block}
.brand-name{font-size:18px;letter-spacing:-.4px;font-weight:600;line-height:1.3}
.film{margin:0;width:100%;aspect-ratio:910/512;background:#e6e3df;overflow:hidden;border-radius:3px}
.film video{display:block;width:100%;height:100%;object-fit:contain}
.access{min-width:0;display:grid;align-content:center;justify-items:center;padding:56px clamp(32px,4.5vw,72px)}
.access-inner{width:100%;max-width:338px}
h1{font-size:34px;line-height:1.2;letter-spacing:-1.3px;font-weight:600;margin:0 0 10px}
.description{font-size:15px;color:var(--muted);line-height:1.6;margin:0 0 29px}
.microsoft{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:46px;padding:12px 16px;border:1px solid #c8cac9;border-radius:4px;background:var(--paper);font:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.microsoft:hover{background:#f5f5f4;border-color:#999b9a}
.microsoft:focus-visible{outline:2px solid #946044;outline-offset:3px}
.microsoft svg{width:18px;height:18px;flex:none}
.status{font-size:13px;color:var(--muted);line-height:1.5;margin:14px 0 0}.status[hidden]{display:none}
@media(max-width:900px){.layout{grid-template-columns:55% 45%}.institution{padding:40px 28px}.access{padding:40px 28px}.brand{margin-bottom:24px}}
@media(max-width:650px){.layout{grid-template-columns:1fr;grid-template-rows:auto 1fr}.institution{padding:26px 24px 28px;border-right:0;border-bottom:1px solid #e8e6e2}.brand{margin-bottom:20px;gap:12px;min-height:36px}.brand img{width:42px;height:36px}.brand-name{font-size:16px}.access{padding:48px 28px 58px;align-content:start}.access-inner{max-width:390px}h1{font-size:30px}.description{margin-bottom:24px}}
@media(prefers-reduced-motion:reduce){.film video{display:none}.film{background:#e6e3df url('../assets/mascarenhas-login-poster.jpg') center/contain no-repeat}}
</style>
</head>
<body>
<main class="layout">
<section class="institution" aria-label="Mascarenhas Barbosa">
<div class="institution-inner">
<header class="brand"><img src="../favicon-copper.svg" alt=""><span class="brand-name">Mascarenhas Barbosa</span></header>
<div class="film"><video autoplay muted loop playsinline preload="metadata" poster="../assets/mascarenhas-login-poster.jpg" aria-label="Vídeo institucional do Mascarenhas Barbosa"><source src="../assets/mascarenhas-login.mp4" type="video/mp4"></video></div>
</div>
</section>
<section class="access" aria-labelledby="access-title">
<div class="access-inner">
<h1 id="access-title">Backoffice</h1>
<p class="description">Acesse sua conta institucional.</p>
<button type="button" class="microsoft" id="microsoft"><svg viewBox="0 0 23 23" aria-hidden="true"><rect width="11" height="11" fill="#f25022"/><rect x="12" width="11" height="11" fill="#7fba00"/><rect y="12" width="11" height="11" fill="#00a4ef"/><rect x="12" y="12" width="11" height="11" fill="#ffb900"/></svg>Entrar com Microsoft</button>
<p class="status" id="status" role="status" hidden>Protótipo visual. A autenticação não está conectada neste ambiente.</p>
</div>
</section>
</main>
<script>
const video=document.querySelector('video');
if(matchMedia('(prefers-reduced-motion: reduce)').matches){video.autoplay=false;video.pause();}
document.querySelector('#microsoft').addEventListener('click',()=>{document.querySelector('#status').hidden=false;});
</script>
</body>
</html>
