<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backoffice | Mascarenhas Barbosa</title>
<link rel="icon" href="../favicon-copper.svg">
<style>
:root{color-scheme:light;--ink:#181b1d;--muted:#62676a;--line:#d8dbdc;--paper:#fff;--brand:#b97a58;--video-bg:#17191b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
.layout{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:60% 40%}
.institution{display:flex;flex-direction:column;min-width:0;background:var(--video-bg);color:#fff}
.brand{display:flex;align-items:center;gap:17px;padding:22px 40px;min-height:92px}
.brand img{width:58px;height:58px;object-fit:contain;display:block}
.brand-name{font-size:19px;letter-spacing:-.45px;font-weight:550}
.film{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--video-bg)}
.film video{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:25% 50%}
.access{min-width:0;display:flex;align-items:center;justify-content:center;padding:48px 44px;position:relative}
.access-inner{width:100%;max-width:340px}
h1{font-size:36px;line-height:1.15;letter-spacing:-1.2px;font-weight:550;margin:0 0 12px}
.description{font-size:15px;color:var(--muted);line-height:1.55;margin:0 0 32px}
.microsoft{display:flex;align-items:center;justify-content:center;gap:13px;width:100%;min-height:48px;padding:12px 18px;border:1px solid var(--line);border-radius:5px;background:var(--paper);font:inherit;font-size:14px;font-weight:550;color:var(--ink);cursor:pointer}
.microsoft:hover{background:#f5f5f4;border-color:#a8aaac}
.microsoft:focus-visible{outline:2px solid #946044;outline-offset:3px}
.microsoft svg{width:20px;height:20px;flex:none}
.status{font-size:13px;color:var(--muted);line-height:1.5;margin:14px 0 0}
.status[hidden]{display:none}
@media(max-width:900px){.layout{grid-template-columns:54% 46%}.brand{padding:20px 26px}.access{padding:40px 30px}}
@media(max-width:650px){.layout{grid-template-columns:1fr;grid-template-rows:auto minmax(300px,1fr)}.brand{padding:14px 22px;min-height:64px;gap:12px}.brand img{width:43px;height:43px}.brand-name{font-size:16px}.film{height:clamp(180px,34svh,280px);flex:none}.access{padding:60px 28px 58px;align-items:flex-start}.access-inner{max-width:390px}h1{font-size:32px}.description{margin-bottom:26px}}
@media(prefers-reduced-motion:reduce){.film video{display:none}.film{background:var(--video-bg) url('../assets/mascarenhas-login-poster.jpg') center/cover no-repeat}}
</style>
</head>
<body>
<main class="layout">
<section class="institution" aria-label="Mascarenhas Barbosa">
<header class="brand"><img src="../favicon-copper.svg" alt=""><span class="brand-name">Mascarenhas Barbosa</span></header>
<div class="film"><video autoplay muted loop playsinline preload="metadata" poster="../assets/mascarenhas-login-poster.jpg" aria-label="Vídeo institucional do Mascarenhas Barbosa"><source src="../assets/mascarenhas-login.mp4" type="video/mp4"></video></div>
</section>
<section class="access" aria-labelledby="access-title">
<div class="access-inner">
<h1 id="access-title">Backoffice</h1>
<p class="description">Acesse sua conta institucional.</p>
<button type="button" class="microsoft" id="microsoft"><svg viewBox="0 0 23 23" aria-hidden="true"><rect width="11" height="11" fill="#f25022"/><rect x="12" width="11" height="11" fill="#7fba00"/><rect y="12" width="11" height="11" fill="#00a4ef"/><rect x="12" y="12" width="11" height="11" fill="#ffb900"/></svg>Entrar com Microsoft</button>
<p class="status" id="status" role="status" hidden>Protótipo visual. A autenticação não está conectada neste ambiente.</p>
</div>
</section>
</main>
<script>
const video=document.querySelector('video');
if(matchMedia('(prefers-reduced-motion: reduce)').matches){video.autoplay=false;video.pause();}
document.querySelector('#microsoft').addEventListener('click',()=>{document.querySelector('#status').hidden=false;});
</script>
</body>
</html>
